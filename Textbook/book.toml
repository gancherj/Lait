[book]
title = "Lait Book"
authors = ["gancherj"]
language = "en"

# Runs every ```lean block through the Lean language server for highlighting,
# hovers and diagnostics. `@leandown/mdbook` is a `file:` dependency on the
# leandown checkout next to this repo (see package.json), so this runs the
# development sources directly — no rebuild of that package needed after editing
# them. `npm install` recreates the link.
[preprocessor.leandown]
command = "bun ./node_modules/@leandown/mdbook/main.ts"
# Elaborate code blocks inside the Lait Lean project at the repo root (path is
# relative to this file) so blocks can `import Lait`. Run `lake build Lait`
# there before building the book — imports resolve against build artifacts.
lean-project-path = ".."

[output.html]
# Generated by `npm run assets` from the linked leandown checkout.
additional-js = ["leandown.js"]
additional-css = ["leandown.css", "leandown-overrides.css"]
